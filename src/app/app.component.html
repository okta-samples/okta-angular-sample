<header class="flex items-center justify-between h-16 px-4 bg-white shadow">
  <div class="flex items-center gap-6">
    <img
      width="90"
      height="48"
      alt="Okta logo"
      ngSrc="okta-logo-180.png"
      priority
    />
    @if (isAuthenticated$ | async) {
      <nav class="flex items-center gap-4 text-cyan-800">
        <a class="hover:text-cyan-600 hover:underline" routerLink="/">Home</a>
        <a class="hover:text-cyan-600 hover:underline" routerLink="/profile">Profile</a>
        <a class="hover:text-cyan-600 hover:underline" routerLink="/messages">Messages</a>
        <a class="hover:text-cyan-600 hover:underline" routerLink="/protected">Protected</a>
      </nav>
    }
  </div>

  @if (isAuthenticated$ | async) {
    <button type="button" class="rounded border border-gray-200 px-3 py-1 text-sm font-medium text-gray-600 hover:shadow" (click)="signOut()">Sign out</button>
  } @else {

    <a routerLink="/login" class="rounded border border-gray-200 px-3 py-1 text-sm font-medium text-gray-600 hover:shadow">Sign in</a>

  }
</header>

<main class="flex flex-col items-center max-w-3xl mx-auto px-4 py-8">
  <router-outlet></router-outlet>
</main>

<footer class="mt-10 border-t border-gray-200 bg-white">
  <div class="mx-auto flex max-w-3xl flex-col items-center justify-between gap-2 px-4 py-5 text-sm text-gray-600 sm:flex-row">
    <p>Made with 💙 by Okta for Developers.</p>
    <div class="flex items-center gap-4">
      <a class="hover:text-cyan-600 hover:underline" target="_blank" rel="noopener" href="https://developer.okta.com">Developer Portal</a>
      <a class="hover:text-cyan-600 hover:underline" target="_blank" rel="noopener" href="https://devforum.okta.com">DevForum</a>
      <a class="hover:text-cyan-600 hover:underline" target="_blank" rel="noopener" href="https://developer.okta.com/blog/">Blog</a>
    </div>
  </div>
</footer>
